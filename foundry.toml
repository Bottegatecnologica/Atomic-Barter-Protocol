[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache_forge"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 128

[profile.default.invariant]
runs = 32
depth = 15
fail_on_revert = true
